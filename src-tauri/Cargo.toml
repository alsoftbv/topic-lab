[package]
name = "mqtt-topic-lab"
version = "0.3.0"
description = "MQTT Topic Lab - Send saved commands via buttons"
authors = ["Altuğ Bakan <altugbakan@gmail.com>"]
edition = "2021"

[lib]
name = "mqtt_topic_lab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rumqttc = { version = "0.24", features = ["use-rustls"] }
rustls = "0.22"
rustls-pemfile = "2"
rustls-native-certs = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "signal"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
thiserror = "1"
regex = "1"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["clock"] }
rand = "0.8"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"

