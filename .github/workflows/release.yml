name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Cache tauri-driver
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-${{ runner.os }}-stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            webkit2gtk-driver \
            xvfb

      - name: Install tauri-driver
        run: which tauri-driver || cargo install tauri-driver --locked

      - name: Install frontend dependencies
        run: npm ci

      - name: Install E2E dependencies
        run: cd e2e && npm ci

      - name: Run E2E tests
        env:
          MQTT_TOPIC_LAB_DATA_DIR: /tmp/mqtt-topic-lab-e2e
        run: cd e2e && xvfb-run npm test

  build:
    needs: e2e
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
            updater_key: darwin-aarch64
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macos-x64
            updater_key: darwin-x86_64
          - platform: ubuntu-22.04
            target: ''
            name: linux-x64
            updater_key: linux-x86_64
          - platform: windows-latest
            target: ''
            name: windows-x64
            updater_key: windows-x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            npm run tauri build -- --target ${{ matrix.target }}
          else
            npm run tauri build
          fi
        shell: bash

      - name: Rename artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          VERSION="${{ github.ref_name }}"
          mv "src-tauri/target/${{ matrix.target }}/release/bundle/dmg/"*.dmg \
             "MQTT-Topic-Lab-${VERSION}-${{ matrix.name }}.dmg"

      - name: Rename artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          VERSION="${{ github.ref_name }}"
          mv src-tauri/target/release/bundle/appimage/*.AppImage \
             "MQTT-Topic-Lab-${VERSION}-${{ matrix.name }}.AppImage"
          mv src-tauri/target/release/bundle/deb/*.deb \
             "MQTT-Topic-Lab-${VERSION}-${{ matrix.name }}.deb"
          mv src-tauri/target/release/bundle/rpm/*.rpm \
             "MQTT-Topic-Lab-${VERSION}-${{ matrix.name }}.rpm"

      - name: Rename artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $name = "${{ matrix.name }}"
          Move-Item "src-tauri/target/release/bundle/msi/*.msi" "MQTT-Topic-Lab-${version}-${name}.msi"
          Move-Item "src-tauri/target/release/bundle/nsis/*.exe" "MQTT-Topic-Lab-${version}-${name}-setup.exe"

      # Collect the signed updater bundle (the artifact the in-app updater downloads)
      # and emit a per-platform fragment for latest.json.
      - name: Collect updater artifact (macOS / Linux)
        if: matrix.platform != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          NAME="${{ matrix.name }}"
          KEY="${{ matrix.updater_key }}"
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            SRC=$(ls src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz)
            OUT="MQTT-Topic-Lab-${VERSION}-${NAME}.app.tar.gz"
          else
            SRC=$(ls src-tauri/target/release/bundle/appimage/*.AppImage)
            OUT="MQTT-Topic-Lab-${VERSION}-${NAME}.AppImage"
          fi
          cp "$SRC" "$OUT"
          mkdir -p updater
          cp "$OUT" updater/
          jq -n \
            --arg key "$KEY" \
            --arg sig "$(cat "${SRC}.sig")" \
            --arg url "https://github.com/alsoftbv/topic-lab/releases/download/${VERSION}/${OUT}" \
            '{($key): {signature: $sig, url: $url}}' > "updater/frag-${NAME}.json"

      - name: Collect updater artifact (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $name = "${{ matrix.name }}"
          $key = "${{ matrix.updater_key }}"
          $src = (Get-Item "src-tauri/target/release/bundle/nsis/*-setup.exe").FullName
          $out = "MQTT-Topic-Lab-${version}-${name}-setup.exe"
          Copy-Item "$src" "$out"
          New-Item -ItemType Directory -Force -Path updater | Out-Null
          Copy-Item "$out" updater/
          $sig = Get-Content "${src}.sig" -Raw
          $url = "https://github.com/alsoftbv/topic-lab/releases/download/${version}/${out}"
          @{ $key = @{ signature = $sig.Trim(); url = $url } } | ConvertTo-Json -Depth 5 | Set-Content "updater/frag-${name}.json"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.name }}
          path: MQTT-Topic-Lab-*

      - name: Upload updater artifacts
        uses: actions/upload-artifact@v7
        with:
          name: updater-${{ matrix.name }}
          path: updater/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: installers
          merge-multiple: true

      - name: Download updater artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: updater-*
          path: updater
          merge-multiple: true

      - name: Build latest.json
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          PLATFORMS=$(jq -s 'add' updater/frag-*.json)
          jq -n \
            --arg version "${VERSION#v}" \
            --arg notes "See https://github.com/alsoftbv/topic-lab/releases/tag/${VERSION}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$PLATFORMS" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
            > latest.json
          rm -f updater/frag-*.json
          cat latest.json

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            installers/MQTT-Topic-Lab-*
            updater/MQTT-Topic-Lab-*
            latest.json
